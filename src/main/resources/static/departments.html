
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Management | MediCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>🏥 MediCare</h2>
        <p class="subtitle">Hospital Management</p>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="patients.html">Patients</a>
            <a href="doctors.html">Doctors</a>
            <a href="departments.html" class="active">Departments</a>
            <a href="appointments.html">Appointments</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Department Management</h1>
                <p>Create and manage hospital departments</p>
            </div>
            <div class="admin">Administrator</div>
        </header>

        <!-- Department Form -->
        <section class="patient-form-card">

            <h2 id="departmentFormTitle">Add New Department</h2>

            <form id="departmentForm">

                <input type="hidden" id="departmentId">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="departmentName">Department Name</label>
                        <input
                            type="text"
                            id="departmentName"
                            placeholder="Example: Cardiology"
                            maxlength="100"
                            required>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            rows="4"
                            placeholder="Enter department description"
                            required></textarea>
                    </div>

                </div>

                <div class="form-buttons">

                    <button type="submit" id="departmentSubmitBtn">
                        Add Department
                    </button>

                    <button
                        type="button"
                        id="departmentCancelBtn"
                        class="cancel-btn"
                        hidden>
                        Cancel Edit
                    </button>

                </div>

            </form>

        </section>

        <!-- Department List -->
        <section class="patient-list-card">

            <div class="list-header">
                <h2>All Departments</h2>

                <input
                    type="search"
                    id="searchDepartment"
                    placeholder="Search department...">
            </div>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Department Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="departmentTableBody">
                        <tr>
                            <td colspan="4">Loading departments...</td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </section>

    </main>
</div>

<script src="js/departments.js"></script>

</body>
</html>
