
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Management | MediCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <h2>🏥 MediCare</h2>
        <p class="subtitle">Hospital Management</p>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="patients.html">Patients</a>
            <a href="doctors.html" class="active">Doctors</a>
            <a href="departments.html">Departments</a>
            <a href="appointments.html">Appointments</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Doctor Management</h1>
                <p>Register and manage hospital doctors</p>
            </div>
            <div class="admin">Administrator</div>
        </header>

        <!-- Doctor Form -->
        <section class="patient-form-card">

            <h2 id="doctorFormTitle">Add New Doctor</h2>

            <form id="doctorForm">

                <input type="hidden" id="doctorId">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="doctorName">Doctor Name</label>
                        <input type="text" id="doctorName"
                               placeholder="Enter doctor name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email"
                               placeholder="Enter email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone"
                               placeholder="Enter phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="qualification">Qualification</label>
                        <input type="text" id="qualification"
                               placeholder="Example: MBBS, MD" required>
                    </div>

                    <div class="form-group">
                        <label for="specialization">Specialization</label>
                        <input type="text" id="specialization"
                               placeholder="Example: Cardiology" required>
                    </div>

                    <div class="form-group">
                        <label for="experienceYears">Experience (Years)</label>
                        <input type="number" id="experienceYears"
                               min="0" max="70" placeholder="Enter experience"
                               required>
                    </div>

                    <div class="form-group">
                        <label for="consultationFee">Consultation Fee (₹)</label>
                        <input type="number" id="consultationFee"
                               min="0" step="0.01"
                               placeholder="Enter consultation fee" required>
                    </div>

                    <div class="form-group">
                        <label for="departmentId">Department</label>
                        <select id="departmentId" required>
                            <option value="">Select Department</option>
                        </select>
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="submit" id="doctorSubmitBtn">
                        Add Doctor
                    </button>

                    <button type="button" id="doctorCancelBtn"
                            class="cancel-btn" hidden>
                        Cancel Edit
                    </button>
                </div>

            </form>
        </section>

        <!-- Doctor List -->
        <section class="patient-list-card">

            <div class="list-header">
                <h2>All Doctors</h2>

                <input type="search" id="searchDoctor"
                       placeholder="Search by name or specialization">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Qualification</th>
                            <th>Experience</th>
                            <th>Department</th>
                            <th>Fee (₹)</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="doctorTableBody">
                        <tr>
                            <td colspan="8">Loading doctors...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>
</div>

<script src="js/doctors.js"></script>

</body>
</html>
