
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management | MediCare</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>🏥 MediCare</h2>
        <p class="subtitle">Hospital Management</p>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="patients.html" class="active">Patients</a>
            <a href="doctors.html">Doctors</a>
            <a href="departments.html">Departments</a>
            <a href="appointments.html">Appointments</a>
        </nav>
    </aside>

    <!-- Main content -->
    <main class="main-content">
 
        <header class="topbar">
            <div>
                <h1>Patient Management</h1>
                <p>Register and manage hospital patients</p>
            </div>
            <div> <a href="admin">Administrator</a></div>
        </header>

        <!-- Patient form -->
        <section class="patient-form-card">

            <h2 id="formTitle">Add New Patient</h2>

            <form id="patientForm">

                <input type="hidden" id="patientId">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="name">Patient Name</label>
                        <input type="text" id="name"
                               placeholder="Enter patient name" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age"
                               placeholder="Enter age" min="0" max="120" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>                
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone"
                               placeholder="Enter phone number" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Address</label>
                        <textarea id="address"
                                  placeholder="Enter patient address"
                                  rows="3" required></textarea>
                    </div>

                </div>

                <div class="form-buttons">
                    <button type="submit" id="submitBtn">
                        Add Patient
                    </button>

                    <button type="button" id="cancelBtn"
                            class="cancel-btn" hidden>
                        Cancel Edit
                    </button>
                </div>

            </form>

        </section>

        <!-- Patient list -->
        <section class="patient-list-card">

            <div class="list-header">
                <h2>All Patients</h2>

                <input type="search" id="searchPatient"
                       placeholder="Search patient by name...">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="patientTableBody">
                        <tr>
                            <td colspan="7">Loading patients...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>
</div>

<script src="js/patients.js"></script>

</body>
</html>
